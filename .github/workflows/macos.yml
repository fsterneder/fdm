name: macOS build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-transport.sh
      - run: swift test
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fdm-macOS
          path: dist/fdm-0.17.1.zip

